<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Creator</title>
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 2rem auto; padding: 0 16px; background: #f6f6f6; color: #222; }
  label { display: block; margin: .8rem 0 .3rem; font-weight: 600; }
  input[type=text] { width: 100%; padding: .5rem; box-sizing: border-box; }
  .row { display: flex; gap: 1rem; }
  #qr { margin: 1.5rem 0; display: flex; justify-content: center; }
  #qr canvas { max-width: 100%; height: auto; }
  button { padding: .5rem 1rem; margin-right: .5rem; cursor: pointer; }
</style>
</head>
<body>
<h1>QR Creator</h1>

<label for="text">Text or URL</label>
<input id="text" type="text" value="https://github.com">

<div class="row">
  <div><label for="fg">QR color</label><input id="fg" type="color" value="#000000"></div>
  <div><label for="bg">Background</label><input id="bg" type="color" value="#ffffff"></div>
</div>

<label for="img">Center picture</label>
<input id="img" type="file" accept="image/*">
<button id="clear" type="button">Remove picture</button>

<div id="qr"></div>
<button id="png" type="button">Download PNG</button>
<button id="svg" type="button">Download SVG</button>

<script>
  const $ = id => document.getElementById(id);
  let image = '';
  const qr = new QRCodeStyling({ width: 300, height: 300, margin: 10,
    imageOptions: { margin: 4, hideBackgroundDots: true, imageSize: 0.35 } });
  qr.append($('qr'));

  function update() {
    qr.update({
      data: $('text').value || ' ',
      image: image || undefined,
      // High error correction so the code still scans with a picture covering the middle
      qrOptions: { errorCorrectionLevel: image ? 'H' : 'M' },
      dotsOptions: { color: $('fg').value },
      cornersSquareOptions: { color: $('fg').value },
      cornersDotOptions: { color: $('fg').value },
      backgroundOptions: { color: $('bg').value },
    });
  }

  ['text', 'fg', 'bg'].forEach(id => $(id).addEventListener('input', update));
  $('img').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { image = reader.result; update(); };
    reader.readAsDataURL(file);
  });
  $('clear').onclick = () => { image = ''; $('img').value = ''; update(); };
  $('png').onclick = () => qr.download({ name: 'qr', extension: 'png' });
  $('svg').onclick = () => qr.download({ name: 'qr', extension: 'svg' });
  update();
</script>
</body>
</html>
